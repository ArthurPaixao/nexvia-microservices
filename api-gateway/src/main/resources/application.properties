spring.application.name=api-gateway

server.port=8082

# config do Eureka Client (do Gateway)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Endereco do Eureka Server (defaultZone e camelCase)
# localhost 8761, onde o Eureka Server esta recebendo as requisicoes
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Discovery Locator (rotas dinamicas via Eureka)
# http://localhost:8082/<nome-do-microsservico>/<endpoint>
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# Converte o ID dos servicos registrados no Eureka
# para minusculas ao criar rotas dinamicas
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
