spring.application.name=ms-alertas

spring.profiles.active=dev
spring.jpa.open-in-view=false

# Eureka Client: registra no Eureka Server e busca o catalogo (registry)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Endereco do Eureka Server (defaultZone e camelCase)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Porta aleatoria para permitir multiplas instancias (escala local)
server.port=0

# Identificador da instancia (evita sobrescrever no registry)
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

# Circuit Breaker: monitora as ultimas 3 chamadas ao ms-apoio
resilience4j.circuitbreaker.instances.alterarStatusPessoa.slidingWindowSize=3

# Tipo da janela: por quantidade de chamadas
# COUNT_BASED = ultimas N chamadas
# TIME_BASED = ultimos N segundos
resilience4j.circuitbreaker.instances.alterarStatusPessoa.slidingWindowType=COUNT_BASED

# So comeca a calcular taxa de falha apos pelo menos 2 chamadas
resilience4j.circuitbreaker.instances.alterarStatusPessoa.minimumNumberOfCalls=2

# Abre o circuito quando a taxa de falhas atingir 50%
resilience4j.circuitbreaker.instances.alterarStatusPessoa.failureRateThreshold=50

# Tempo que o circuito permanece OPEN antes de ir para HALF_OPEN
resilience4j.circuitbreaker.instances.alterarStatusPessoa.waitDurationInOpenState=50s

# Em HALF_OPEN, permite 2 chamadas de teste
resilience4j.circuitbreaker.instances.alterarStatusPessoa.permittedNumberOfCallsInHalfOpenState=2

# Erros de negocio (404 / 409) nao contam como falha de comunicacao
resilience4j.circuitbreaker.instances.alterarStatusPessoa.ignoreExceptions=\
  com.github.arthurpaixao.ms.alertas.exceptions.ResourceNotFoundException,\
  com.github.arthurpaixao.ms.alertas.exceptions.StatusInvalidoException

# Swagger (via API Gateway): http://localhost:8082/swagger-ui/index.html
# JSON format (via API Gateway): http://localhost:8082/ms-alertas/v3/api-docs
